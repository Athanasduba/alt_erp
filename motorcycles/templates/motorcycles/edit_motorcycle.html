{% extends "base.html" %}
{% block title %}Edit Motorcycle{% endblock %}
{% block page_header %}Edit Motorcycle{% endblock %}

{% block content %}
<div class="card">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-warning">Save Changes</button>
      <a href="{% url 'motorcycle_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
