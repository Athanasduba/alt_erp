{% extends "base.html" %}
{% block title %}Upload Motorcycles{% endblock %}
{% block page_header %}Upload Motorcycles via Excel{% endblock %}

{% block content %}
<div class="card">
  <div class="card-body">
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      <div class="form-group">
        <label for="excel_file">Excel File (.xls, .xlsx)</label>
        <input type="file" name="excel_file" id="excel_file" class="form-control" accept=".xls,.xlsx" required>
      </div>
      <button type="submit" class="btn btn-primary">Upload</button>
    </form>
    <p class="mt-3 text-muted">
      Expected columns: <strong>vin, frame_number, engine_number, model, brand, color, category</strong>
    </p>
  </div>
</div>
{% endblock %}
