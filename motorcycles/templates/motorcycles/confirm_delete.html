{% extends "base.html" %}
{% block title %}Confirm Delete{% endblock %}
{% block page_header %}Delete Motorcycle{% endblock %}

{% block content %}
<div class="card">
  <div class="card-body">
    <p>Are you sure you want to delete motorcycle <strong>{{ motorcycle.vin }}</strong>?</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Yes, Delete</button>
      <a href="{% url 'motorcycle_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
