{% extends "base.html" %}
{% block title %}Pay Commission{% endblock %}
{% block page_header %}Pay Agent Commission{% endblock %}
{% block content %}

<div class="card card-success">
  <div class="card-header">
    <h3 class="card-title">Commission Payout</h3>
  </div>
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label for="agent_id">Select Agent</label>
        <select name="agent_id" id="agent_id" class="form-control">
          {% for acc in agents %}
            <option value="{{ acc.agent.id }}">{{ acc.agent.full_name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label for="start_date">Start Date</label>
        <input type="date" name="start_date" id="start_date" class="form-control">
      </div>

      <div class="form-group">
        <label for="end_date">End Date</label>
        <input type="date" name="end_date" id="end_date" class="form-control">
      </div>

      <div class="form-group">
        <button type="submit" class="btn btn-success">
          <i class="fas fa-money-check-alt"></i> Pay Commission
        </button>
      </div>
    </form>
  </div>
</div>

{% endblock %}
