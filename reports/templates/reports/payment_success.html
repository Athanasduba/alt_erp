{% extends "base.html" %}
{% block title %}Payment Success Report{% endblock %}
{% block content %}
<div class="container-fluid">
  <h2 class="mb-4 text-primary">Payment Success Report</h2>
  {% include "reports/_export_buttons.html" %}
  <div class="card">
    <div class="card-body table-responsive p-0">
      <table class="table table-hover text-nowrap">
        <thead><tr><th>Status</th><th>Count</th></tr></thead>
        <tbody>
          {% for p in payments %}
            <tr><td>{{ p.status }}</td><td>{{ p.count }}</td></tr>
          {% empty %}
            <tr><td colspan="2">No payments found.</td></tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
